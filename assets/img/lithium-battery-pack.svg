<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="600" y1="60" x2="600" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EAF3F8"/>
    </linearGradient>
    <linearGradient id="rackSide" x1="920" y1="160" x2="1060" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#344B5D"/>
      <stop offset="1" stop-color="#172A39"/>
    </linearGradient>
    <linearGradient id="rackFront" x1="250" y1="150" x2="920" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29475A"/>
      <stop offset="1" stop-color="#142936"/>
    </linearGradient>
    <linearGradient id="shelf" x1="250" y1="0" x2="970" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#496879"/>
      <stop offset=".5" stop-color="#243E50"/>
      <stop offset="1" stop-color="#152A38"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F7FCFE"/>
      <stop offset=".55" stop-color="#D8E7EC"/>
      <stop offset="1" stop-color="#B9CDD5"/>
    </linearGradient>
    <linearGradient id="moduleTop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9DCE3"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BA9B3"/>
      <stop offset="1" stop-color="#405E6A"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6FF2E4"/>
      <stop offset="1" stop-color="#13B7C4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#183545" flood-opacity=".2"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#102936" flood-opacity=".3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#8EAAB4" opacity=".35"/>
    </pattern>
  </defs>

