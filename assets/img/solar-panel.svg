<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Солнечная панель</title>
  <desc id="desc">Одиночная солнечная панель с тёмно-синими фотоэлементами, алюминиевой рамой и лёгким бликом.</desc>

  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.22" stop-color="#aeb9c4"/>
      <stop offset="0.5" stop-color="#eef2f5"/>
      <stop offset="0.78" stop-color="#8795a2"/>
      <stop offset="1" stop-color="#d8e0e6"/>
    </linearGradient>

    <linearGradient id="cellGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c43"/>
      <stop offset="0.48" stop-color="#0b3470"/>
      <stop offset="1" stop-color="#061b3e"/>
    </linearGradient>

    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea7d5" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#b9e4ff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#020e29" stop-opacity=".18"/>
    </linearGradient>

    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="cellGrid" width="76" height="53" patternUnits="userSpaceOnUse">
      <rect width="76" height="53" fill="url(#cellGradient)"/>
      <path d="M76 0H0V53" fill="none" stroke="#081936" stroke-width="3"/>
      <path d="M2 2H74V51H2Z" fill="none" stroke="#47719a" stroke-opacity=".38" stroke-width="1"/>
      <path d="M38 3V50" stroke="#9bc8e8" stroke-opacity=".14" stroke-width="1"/>
      <path d="M3 26.5H73" stroke="#9bc8e8" stroke-opacity=".1" stroke-width="1"/>
    </pattern>

    <clipPath id="panelClip">
      <polygon points="137,113 663,113 700,386 100,386"/>
    </clipPath>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#071425" flood-opacity=".35"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="431" rx="300" ry="22" fill="#0a1d31" opacity=".16"/>

  <g filter="url(#shadow)">
    <polygon points="120,88 680,88 733,411 67,411" fill="url(#frameGradient)"/>
    <polygon points="137,113 663,113 700,386 100,386" fill="url(#cellGradient)"/>

    <g clip-path="url(#panelClip)">
      <rect x="80" y="100" width="640" height="300" fill="url(#cellGrid)"/>
      <rect x="80" y="100" width="640" height="300" fill="url(#panelSheen)"/>

      <path d="M80 392L710 105H770L130 400Z" fill="url(#glare)" opacity=".5"/>
      <path d="M150 112L665 112L700 386L100 386Z" fill="none" stroke="#c9eaff" stroke-opacity=".16" stroke-width="3"/>
    </g>

    <polygon points="120,88 680,88 663,113 137,113" fill="#ffffff" opacity=".58"/>
    <polygon points="680,88 733,411 700,386 663,113" fill="#778793" opacity=".55"/>
    <polygon points="67,411 733,411 700,386 100,386" fill="#7d8b97" opacity=".7"/>
    <polygon points="67,411 120,88 137,113 100,386" fill="#e7edf1" opacity=".72"/>

    <path d="M120 88H680L733 411H67Z" fill="none" stroke="#f8fafb" stroke-opacity=".72" stroke-width="3"/>
    <path d="M137 113H663L700 386H100Z" fill="none" stroke="#526572" stroke-width="2"/>

    <circle cx="119" cy="101" r="4" fill="#71808b"/>
    <circle cx="681" cy="101" r="4" fill="#71808b"/>
    <circle cx="72" cy="398" r="4" fill="#687782"/>
    <circle cx="728" cy="398" r="4" fill="#687782"/>
  </g>
</svg>