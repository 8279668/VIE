    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            line-height: 1.6;
            background: #f7fafc;
        }
        .hero {
            background: linear-gradient(135deg, #1e6091 0%, #168aad 100%);
            color: white;
            padding: 70px 20px 60px;
            text-align: center;
        }
        .hero h1 { font-size: 2.4rem; margin-bottom: 16px; }
        .hero p {
            font-size: 1.15rem;
            max-width: 720px;
            margin: 0 auto 28px;
            opacity: 0.95;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Каталог */
        .catalog { padding: 50px 0 70px; }
        .catalog-header { text-align: center; margin-bottom: 30px; }
        .catalog-header h2 { color: #1a3b5d; font-size: 2rem; margin-bottom: 10px; }
        .catalog-header p { color: #64748b; }

        .search-box {
            max-width: 500px;
            margin: 0 auto 25px;
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            transition: 0.2s;
            background: white;
        }
        .search-input:focus {
            outline: none;
            border-color: #168aad;
            box-shadow: 0 0 0 4px rgba(22, 138, 173, 0.1);
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .filter-btn {
            padding: 8px 18px;
            border: 1.5px solid #cbd5e1;
            background: white;
            border-radius: 24px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            color: #334155;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #168aad;
            color: #168aad;
            transform: translateY(-1px);
        }
        .filter-btn.active {
            background: #168aad;
            color: white;
            border-color: #168aad;
        }
        .filter-btn .count {
            font-size: 11px;
            opacity: 0.7;
            margin-left: 4px;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            color: #64748b;
            font-size: 1.1rem;
        }

        .category-section { margin-bottom: 45px; }
        .category-title {
            font-size: 1.35rem;
            color: #1a3b5d;
            margin-bottom: 5px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .category-desc {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            min-width: 700px;
        }
        th {
            background: #1a3b5d;
            color: white;
            padding: 11px 10px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f8fafc; }
        .model-cell { font-weight: 600; color: #0f172a; min-width: 200px; }
        .features-cell { font-size: 12.5px; color: #64748b; max-width: 200px; }

        footer {
            background: #1a2b3c;
            color: #a0aec0;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 1.7rem; }
            .hero p { font-size: 1rem; }
            .catalog-header h2 { font-size: 1.5rem; }
            .category-title { font-size: 1.15rem; }
            table { font-size: 12.5px; }
            th, td { padding: 8px 6px; }
        }

                { m: "MUST PH19-10048 EXP", u: "48 В", c: "10000 Вт", e: "2×MPPT 27+27А", d: "425×527×145 мм", w: "18 кг", f: "PV до 10000 Вт, 500 В, отдача в сеть" },
                { m: "MUST PH11-15KL3-EU", u: "48 В", c: "15000 Вт", e: "2×MPPT 32+16А", d: "446×692×260 мм", w: "38 кг", f: "3 фазы, PV до 19500 Вт, 800 В, порт генератора" }
            ]
        },
        {
            id: "must-accessories",
            name: "Комплектующие MUST",
            desc: "Дополнительное оборудование MUST.",
            items: [
                { m: "MUST Stick Logger LSW-Micro (USB)", u: "—", c: "—", e: "—", d: "—", w: "—", f: "Wi-Fi мониторинг Solarman, для PV1800/EP1800/EP3000" },
                { m: "Мобильная платформа для LP16-48100 (до 5 шт)", u: "—", c: "—", e: "—", d: "—", w: "—", f: "" }
            ]
        },
        {
            id: "solar-modules",
            name: "Солнечные модули Tongwei",
            desc: "N-type TOPCon монокристаллические модули Tongwei.",
            items: [
                { m: "Tongwei TNC2.0 TWMNH-48HW470", u: "—", c: "470 Вт", e: "КПД 23,5%", d: "1762×1134×30 мм", w: "23,7 кг", f: "N-type TOPCon, Half-cell, чёрная рамка" },
                { m: "Tongwei TNC3.0 TWMNH-66QD650", u: "—", c: "650 Вт", e: "КПД 24,1%", d: "2382×1134×30 мм", w: "32,7 кг", f: "N-type TOPCon, Quarter-Cell, двусторонняя генерация" }
            ]
        }
    ];

    // ===================================================================
    // РЕНДЕРИНГ
    // ===================================================================
    const filtersEl = document.getElementById('categoryFilters');
    const contentEl = document.getElementById('catalogContent');
    const searchInput = document.getElementById('searchInput');

    let activeCategory = 'all';

    function renderFilters() {
        const allCount = CATEGORIES.reduce((sum, c) => sum + c.items.length, 0);
        let html = `<button class="filter-btn active" data-cat="all">Все<span class="count">${allCount}</span></button>`;
        CATEGORIES.forEach(cat => {
            html += `<button class="filter-btn" data-cat="${cat.id}">${cat.name}<span class="count">${cat.items.length}</span></button>`;
        });
        filtersEl.innerHTML = html;

        filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeCategory = btn.dataset.cat;
                filtersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCatalog();
            });
        });
    }

    function renderCatalog() {
        const query = searchInput.value.toLowerCase().trim();
        let html = '';
        let totalShown = 0;

        CATEGORIES.forEach(cat => {
            if (activeCategory !== 'all' && activeCategory !== cat.id) return;

            const filteredItems = cat.items.filter(item => {
                if (!query) return true;
                const searchText = [item.m, item.u, item.c, item.e, item.f, item.d].join(' ').toLowerCase();
                return searchText.includes(query);
            });

            if (filteredItems.length === 0) return;

            totalShown += filteredItems.length;

            html += `<div class="category-section">
                <h3 class="category-title">${cat.name}</h3>
                ${cat.desc ? `<p class="category-desc">${cat.desc}</p>` : ''}
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Модель</th>
                                <th>Напряжение</th>
                                <th>Ёмкость / мощность</th>
                                <th>Энергоёмкость / КПД</th>
                                <th>Габариты</th>
                                <th>Вес</th>
                                <th>Особенности</th>
                            </tr>
                        </thead>
                        <tbody>`;

            filteredItems.forEach(it => {
                html += `<tr>
                    <td class="model-cell">${it.m}</td>
                    <td>${it.u}</td>
                    <td>${it.c}</td>
                    <td>${it.e}</td>
                    <td>${it.d}</td>
                    <td>${it.w}</td>
                    <td class="features-cell">${it.f}</td>
                </tr>`;
            });

            html += `</tbody></table></div></div>`;
        });

        if (totalShown === 0) {
            html = `<div class="no-results">🔍 Ничего не найдено. Попробуйте изменить запрос или выбрать другую категорию.</div>`;
        }

        contentEl.innerHTML = html;
    }

    searchInput.addEventListener('input', renderCatalog);

    // Запуск
    renderFilters();
    renderCatalog();
    </script>
</body>
</html>
